<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" style="background: linear-gradient(135deg, rgba(13, 35, 64, 0.3), rgba(20, 50, 90, 0.2)); border-radius: 16px;">
  <defs>
    <linearGradient id="precursorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#56bdf8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="reactorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="500" y="45" font-size="32" font-weight="700" text-anchor="middle" fill="#e8f4ff" letter-spacing="1">
    DLI-CVD Deposition Process Schema
  </text>
  <text x="500" y="75" font-size="14" text-anchor="middle" fill="#82c9ff" font-style="italic">
    Direct Liquid Injection Chemical Vapor Deposition
  </text>

  <!-- ===== STAGE 1: PRECURSOR SOLUTION ===== -->
  <g>
    <!-- Container -->
    <rect x="60" y="120" width="160" height="140" rx="12" fill="url(#precursorGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Inner highlight -->
    <rect x="65" y="125" width="150" height="130" rx="10" fill="none" stroke="#56bdf8" stroke-width="1" opacity="0.6"/>
    
    <!-- Icon/Elements -->
    <circle cx="100" cy="155" r="8" fill="#38bdf8" opacity="0.7"/>
    <circle cx="135" cy="165" r="7" fill="#7dd3fc" opacity="0.6"/>
    <circle cx="110" cy="185" r="6" fill="#38bdf8" opacity="0.5"/>
    
    <!-- Text -->
    <text x="140" y="155" font-size="16" font-weight="700" fill="#e8f4ff">Precursor</text>
    <text x="140" y="178" font-size="13" fill="#b4e7ff">Solution</text>
    <text x="140" y="200" font-size="11" fill="#7dd3fc" font-weight="500">Li + Nb sources</text>
    <text x="140" y="218" font-size="11" fill="#7dd3fc" font-weight="500">Tuned ligands</text>
  </g>

  <!-- Arrow 1 -->
  <g>
    <path d="M 220 190 L 300 190" stroke="#38bdf8" stroke-width="3.5" fill="none" marker-end="url(#arrowhead)" stroke-linecap="round"/>
    <text x="260" y="180" font-size="12" text-anchor="middle" fill="#b4e7ff" font-weight="600">INJECTION</text>
  </g>

  <!-- ===== STAGE 2: VAPORIZATION ===== -->
  <g>
    <!-- Container -->
    <rect x="300" y="120" width="160" height="140" rx="12" fill="rgba(56,189,248,0.08)" stroke="#56bdf8" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Heating waves -->
    <path d="M 320 200 Q 330 185, 340 200" stroke="#ff9f43" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 345 205 Q 355 190, 365 205" stroke="#ff9f43" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 370 200 Q 380 185, 390 200" stroke="#ff9f43" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- Text -->
    <text x="380" y="155" font-size="16" font-weight="700" fill="#e8f4ff">Vaporization</text>
    <text x="380" y="180" font-size="13" fill="#b4e7ff">Chamber</text>
    <text x="380" y="205" font-size="12" fill="#ff9f43" font-weight="600">100–200°C</text>
    <text x="380" y="225" font-size="11" fill="#7dd3fc">Heated zone</text>
  </g>

  <!-- Arrow 2 -->
  <g>
    <path d="M 460 190 L 540 190" stroke="#38bdf8" stroke-width="3.5" fill="none" marker-end="url(#arrowhead)" stroke-linecap="round"/>
    <text x="500" y="180" font-size="12" text-anchor="middle" fill="#b4e7ff" font-weight="600">VAPOR FLOW</text>
  </g>

  <!-- ===== STAGE 3: CVD REACTOR ===== -->
  <g>
    <!-- Main reactor vessel (circle) -->
    <circle cx="645" cy="190" r="85" fill="url(#reactorGrad)" stroke="#a78bfa" stroke-width="2.5" filter="url(#glow)"/>
    
    <!-- Inner chamber highlight -->
    <circle cx="645" cy="190" r="78" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.4"/>
    
    <!-- Reaction indicator -->
    <circle cx="645" cy="185" r="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" stroke-dasharray="5,5"/>
    <circle cx="645" cy="185" r="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Text -->
    <text x="645" y="155" font-size="18" font-weight="700" text-anchor="middle" fill="#e8f4ff">CVD</text>
    <text x="645" y="180" font-size="18" font-weight="700" text-anchor="middle" fill="#e8f4ff">Reactor</text>
    <text x="645" y="210" font-size="12" text-anchor="middle" fill="#fbbf24" font-weight="600">500–700°C</text>
    <text x="645" y="232" font-size="11" text-anchor="middle" fill="#c4b5fd">High-temp zone</text>
  </g>

  <!-- Arrow 3 -->
  <g>
    <path d="M 730 190 L 810 190" stroke="#38bdf8" stroke-width="3.5" fill="none" marker-end="url(#arrowhead)" stroke-linecap="round"/>
    <text x="770" y="180" font-size="12" text-anchor="middle" fill="#b4e7ff" font-weight="600">DEPOSITION</text>
  </g>

  <!-- ===== STAGE 4: SUBSTRATE & THIN FILM ===== -->
  <g>
    <!-- Substrate base -->
    <rect x="810" y="145" width="130" height="90" rx="8" fill="rgba(50,50,80,0.3)" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Substrate inner -->
    <rect x="815" y="150" width="120" height="30" rx="6" fill="rgba(80,80,120,0.4)" stroke="#7c3aed" stroke-width="1.5" opacity="0.7"/>
    <text x="875" y="173" font-size="11" text-anchor="middle" fill="#c4b5fd" font-weight="600">Si / Sapphire</text>
    
    <!-- Deposited Film -->
    <rect x="815" y="182" width="120" height="25" rx="4" fill="url(#filmGrad)" stroke="#fbbf24" stroke-width="2" filter="url(#glow)"/>
    <text x="875" y="202" font-size="12" text-anchor="middle" fill="#fef3c7" font-weight="700">LiNbO₃ Film</text>
  </g>

  <!-- ===== PROCESS PARAMETERS BOX ===== -->
  <g>
    <!-- Main box -->
    <rect x="50" y="310" width="900" height="155" rx="12" fill="rgba(13,28,60,0.6)" stroke="rgba(56,189,248,0.3)" stroke-width="2" filter="url(#glow)"/>
    <rect x="55" y="315" width="890" height="145" rx="10" fill="none" stroke="rgba(125,211,252,0.15)" stroke-width="1" opacity="0.5"/>
    
    <!-- Title -->
    <text x="70" y="340" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="0.5">KEY PROCESS PARAMETERS</text>
    
    <!-- Column 1: Temperature Profile -->
    <text x="70" y="375" font-size="13" font-weight="700" fill="#7dd3fc">Temperature Control</text>
    <text x="70" y="397" font-size="11" fill="#d7eeff">• Precursor zone: 100–200°C (precise volatility)</text>
    <text x="70" y="415" font-size="11" fill="#d7eeff">• Reactor zone: 500–700°C (decomposition)</text>
    <text x="70" y="433" font-size="11" fill="#d7eeff">• Dynamic feedback system for stability</text>
    
    <!-- Column 2: Chemistry -->
    <text x="380" y="375" font-size="13" font-weight="700" fill="#7dd3fc">Precursor Chemistry</text>
    <text x="380" y="397" font-size="11" fill="#d7eeff">• Aminoalkoxide ligands (proprietary)</text>
    <text x="380" y="415" font-size="11" fill="#d7eeff">• Tunable oligomerization (dimeric → hexameric)</text>
    <text x="380" y="433" font-size="11" fill="#d7eeff">• Z-axis crystallographic orientation control</text>
    
    <!-- Column 3: Outcomes -->
    <text x="690" y="375" font-size="13" font-weight="700" fill="#7dd3fc">Film Properties</text>
    <text x="690" y="397" font-size="11" fill="#d7eeff">• Single-crystal LiNbO₃ films (oriented)</text>
    <text x="690" y="415" font-size="11" fill="#d7eeff">• Thickness control: nm to μm scale</text>
    <text x="690" y="433" font-size="11" fill="#d7eeff">• High optical & photonic quality</text>
  </g>

  <!-- ===== BOTTOM NOTE ===== -->
  <text x="500" y="510" font-size="12" text-anchor="middle" fill="#82c9ff" font-weight="600" letter-spacing="0.5">
    Patented molecular precursor platform enables precise crystallographic control
  </text>
  <text x="500" y="530" font-size="12" text-anchor="middle" fill="#82c9ff" font-weight="600" letter-spacing="0.5">
    for integrated photonics, RF filters, and next-generation quantum optical applications
  </text>

  <!-- ===== PERFORMANCE METRICS ===== -->
  <g>
    <!-- Metrics container -->
    <rect x="50" y="560" width="900" height="70" rx="10" fill="rgba(56,189,248,0.06)" stroke="rgba(125,211,252,0.2)" stroke-width="1.5"/>
    
    <!-- Metric 1 -->
    <circle cx="150" cy="595" r="4" fill="#38bdf8"/>
    <text x="165" y="590" font-size="11" font-weight="700" fill="#e8f4ff">Film Uniformity</text>
    <text x="165" y="604" font-size="10" fill="#b4e7ff">&lt;5% thickness variation</text>
    
    <!-- Metric 2 -->
    <circle cx="415" cy="595" r="4" fill="#34d399"/>
    <text x="430" y="590" font-size="11" font-weight="700" fill="#e8f4ff">Crystalline Quality</text>
    <text x="430" y="604" font-size="10" fill="#b4e7ff">Z-cut preferential orientation</text>
    
    <!-- Metric 3 -->
    <circle cx="700" cy="595" r="4" fill="#a78bfa"/>
    <text x="715" y="590" font-size="11" font-weight="700" fill="#e8f4ff">Reproducibility</text>
    <text x="715" y="604" font-size="10" fill="#b4e7ff">Batch-to-batch consistency proven</text>
  </g>
</svg>